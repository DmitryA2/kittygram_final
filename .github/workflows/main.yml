name: Kittygram CI/CD

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  tests:
    name: Test backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff check backend
        run: |
          cd backend
          ruff check .

      - name: Run backend tests (pytest)
        run: |
          cd backend
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests

  build_and_push:
    name: Build Docker images and push to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t $DOCKER_USERNAME/kittygram_backend:latest ./backend

      - name: Push backend image
        run: |
          docker push $DOCKER_USERNAME/kittygram_backend:latest

      - name: Build frontend image
        run: |
          docker build -t $DOCKER_USERNAME/kittygram_frontend:latest ./frontend

      - name: Push frontend image
        run: |
          docker push $DOCKER_USERNAME/kittygram_frontend:latest

      - name: Build gateway image (nginx)
        run: |
          docker build -t $DOCKER_USERNAME/kittygram_gateway:latest ./nginx

      - name: Push gateway image
        run: |
          docker push $DOCKER_USERNAME/kittygram_gateway:latest

  notification:
    name: Telegram notification on success
    runs-on: ubuntu-latest
    needs: build_and_push
    if: always() && needs.build_and_push.result == 'success'
    steps:
      - name: Send success message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_TOKEN }}
          message: |
            Kittygram CI/CD успешно завершён!
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Коммит: ${{ github.sha }}
            Образы обновлены на Docker Hub.